      <text x="138" y="94" fill="#a8e6ff" font-size="22" font-weight="600" letter-spacing="3">YOUR IMAGES. YOUR CONTROL.</text>
      <text x="72" y="236" fill="#f0f6fc" font-size="78" font-weight="700" letter-spacing="1">找到。確認。<tspan fill="#a8e6ff">歸位。</tspan></text>
      <text x="78" y="300" fill="#b9cada" font-size="30" letter-spacing="1">圖庫留在本機，整理由你決定。</text>
      <g transform="translate(78 374)">
