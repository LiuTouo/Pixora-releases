<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">Pixora — 找到。確認。歸位。</title>
  <desc id="description">深藍與冰藍品牌插畫。散落的圖片卡片經過確認，收進資料夾；代表本機搜尋、人工審核與檔案整理，並非產品介面截圖。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b111f"/>
      <stop offset="1" stop-color="#15283e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263e5d"/>
      <stop offset="1" stop-color="#17273e"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a8e6ff"/>
      <stop offset="1" stop-color="#78a8df"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a8e6ff" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020711" flood-opacity=".45"/>
    </filter>
    <clipPath id="bounds"><rect width="1600" height="560" rx="28"/></clipPath>
  </defs>
