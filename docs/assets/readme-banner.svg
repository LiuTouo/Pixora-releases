    <path d="M939 462q64 31 137 6" fill="none" stroke="#a8e6ff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 8"/>
    <path d="m1067 461 12 6-8 10" fill="none" stroke="#a8e6ff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1" y="1" width="1598" height="558" rx="27" fill="none" stroke="#3c536c" stroke-opacity=".5" stroke-width="2"/>
