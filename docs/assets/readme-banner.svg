    <rect x="830" width="770" height="560" fill="url(#grid)"/>
    <circle cx="1260" cy="280" r="222" fill="none" stroke="#a8e6ff" stroke-opacity=".09"/>
    <circle cx="1260" cy="280" r="278" fill="none" stroke="#a8e6ff" stroke-opacity=".05"/>
    <path d="M78 86H120" stroke="#a8e6ff" stroke-width="3"/>
